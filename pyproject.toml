[project]
name = "fivegs-monitor"
version = "0.1.0"
description = "SLA-aware monitoring and orchestration loop for a sliced Open5GS core on Kubernetes"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.21",
    "pymongo>=4.10",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.9", "numpy>=2.0", "pandas>=2.2"]

[dependency-groups]
dev = ["ruff>=0.8"]

[project.scripts]
fivegs-monitor = "fivegs_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fivegs_monitor"]

[tool.ruff]
line-length = 100
