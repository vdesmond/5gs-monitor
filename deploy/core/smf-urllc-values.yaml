# Second SMF for the URLLC slice (chart third_party/5g-charts/charts/open5gs-smf, release smf-urllc).
image: {tag: 2.7.2}
metrics:
  enabled: true
  serviceMonitor: {enabled: true}
config:
  pcrf: {enabled: false}
customOpen5gsConfig:
  logger: {level: info}
  global: {}
  smf:
    sbi:
      server:
        - {dev: eth0, port: 7777}
      client:
        scp:
          - {uri: http://open5gs-scp-sbi:7777}
    pfcp:
      server:
        - {dev: eth0}
      client:
        upf:
          - {address: upf-urllc-open5gs-upf-pfcp, dnn: [urllc]}
    gtpc:
      server:
        - {dev: eth0}
    gtpu:
      server:
        - {dev: eth0}
    metrics:
      server:
        - {dev: eth0, port: 9090}
    session:
      - {subnet: 10.46.0.0/16, gateway: 10.46.0.1, dnn: urllc}
    dns: [8.8.8.8, 8.8.4.4]
    mtu: 1400
    ctf: {enabled: no}
    info:
      - s_nssai:
          - {sst: 2, sd: "000002", dnn: [urllc]}
